<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Studio 118 - Tu salón de belleza</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            overflow-x: hidden;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
            padding-bottom: 80px;
        }

        .header {
            text-align: center;
            padding: 20px 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: -16px -16px 20px -16px;
            border-radius: 0 0 20px 20px;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-container {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px;
            padding: 16px;
            min-height: 400px;
            max-height: 500px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .message {
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 12px;
            max-width: 80%;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            background: var(--tg-theme-button-color, #667eea);
            color: var(--tg-theme-button-text-color, #ffffff);
            margin-left: auto;
            margin-right: 0;
            text-align: right;
        }

        .message.assistant {
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            border: 1px solid var(--tg-theme-hint-color, #cccccc);
        }

        .message.system {
            background: #fff3cd;
            color: #856404;
            text-align: center;
            font-size: 14px;
            max-width: 100%;
        }

        .input-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--tg-theme-bg-color, #ffffff);
            border-top: 1px solid var(--tg-theme-hint-color, #cccccc);
            padding: 12px 16px;
            display: flex;
            gap: 8px;
            z-index: 100;
        }

        .input-container input {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--tg-theme-hint-color, #cccccc);
            border-radius: 8px;
            font-size: 16px;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000000);
        }

        .input-container input:focus {
            outline: none;
            border-color: var(--tg-theme-button-color, #667eea);
        }

        .input-container button {
            padding: 12px 20px;
            background: var(--tg-theme-button-color, #667eea);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .input-container button:hover {
            opacity: 0.9;
        }

        .input-container button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 8px;
            color: var(--tg-theme-hint-color, #999999);
        }

        .loading.active {
            display: block;
        }

        .loading-dots::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid #f5c6cb;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .quick-action {
            padding: 12px;
            background: var(--tg-theme-button-color, #667eea);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s;
        }

        .quick-action:hover {
            opacity: 0.9;
        }

        .prices-container {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .price-item {
            padding: 12px;
            border-bottom: 1px solid var(--tg-theme-hint-color, #e0e0e0);
        }

        .price-item:last-child {
            border-bottom: none;
        }

        .price-item h3 {
            font-size: 16px;
            margin-bottom: 4px;
        }

        .price-item p {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #666666);
        }

        .price-item .price {
            font-size: 18px;
            font-weight: bold;
            color: var(--tg-theme-button-color, #667eea);
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✨ Studio 118 ✨</h1>
            <p>Tu salón de belleza en El Refugio, Querétaro</p>
        </div>

        <div class="quick-actions" id="quickActions">
            <button class="quick-action" onclick="sendQuickMessage('Hola, quiero información sobre servicios')">
                📋 Servicios
            </button>
            <button class="quick-action" onclick="sendQuickMessage('¿Cuáles son los precios?')">
                💰 Precios
            </button>
            <button class="quick-action" onclick="sendQuickMessage('Quiero agendar una cita')">
                📅 Agendar Cita
            </button>
            <button class="quick-action" onclick="sendQuickMessage('¿Dónde están ubicados?')">
                📍 Ubicación
            </button>
        </div>

        <div class="chat-container" id="chatContainer">
            <!-- Messages will be added here -->
        </div>

        <div class="loading" id="loading">
            <span class="loading-dots">Escribiendo</span>
        </div>

        <div class="input-container">
            <input 
                type="text" 
                id="messageInput" 
                placeholder="Escribe tu mensaje..." 
                autocomplete="off"
            />
            <button id="sendButton" onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        // Telegram WebApp API
        const tg = window.Telegram.WebApp;
        
        // Initialize Telegram WebApp
        tg.ready();
        tg.expand();
        
        // Apply Telegram theme
        document.body.style.backgroundColor = tg.backgroundColor || '#ffffff';
        
        // Get user information from Telegram
        const telegramUser = tg.initDataUnsafe?.user;
        const userId = telegramUser?.id || 'demo_user_' + Math.random().toString(36).substr(2, 9);
        const userName = telegramUser?.first_name || 'Usuario';

        // API Configuration
        const API_BASE_URL = window.location.origin + '/api';
        
        // State management
        let isLoading = false;
        let chatHistory = [];

        // Initialize app
        async function init() {
            addSystemMessage(`¡Hola ${userName}! 👋 Bienvenida a Studio 118`);
            
            // Load session if exists
            await loadSession();
            
            // Add initial greeting from bot
            if (chatHistory.length === 0) {
                addSystemMessage('Estoy aquí para ayudarte con servicios de color, extensiones, nanoplastia y corte. ¿En qué te puedo ayudar hoy? ✨');
            }
        }

        // Load existing session
        async function loadSession() {
            try {
                const response = await fetch(`${API_BASE_URL}/session/${userId}`);
                const data = await response.json();
                
                if (data.success && data.historyLength > 0) {
                    console.log('Session loaded:', data);
                }
            } catch (error) {
                console.error('Error loading session:', error);
            }
        }

        // Add message to chat
        function addMessage(text, type = 'assistant') {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = text;
            chatContainer.appendChild(messageDiv);
            
            // Scroll to bottom
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            // Add to history
            chatHistory.push({ role: type === 'user' ? 'user' : 'assistant', content: text });
        }

        // Add system message
        function addSystemMessage(text) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message system';
            messageDiv.textContent = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Show error message
        function showError(message) {
            const chatContainer = document.getElementById('chatContainer');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.textContent = message;
            chatContainer.appendChild(errorDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            // Auto-remove after 5 seconds
            setTimeout(() => errorDiv.remove(), 5000);
        }

        // Show/hide loading state
        function setLoading(loading) {
            isLoading = loading;
            document.getElementById('loading').className = loading ? 'loading active' : 'loading';
            document.getElementById('sendButton').disabled = loading;
            document.getElementById('messageInput').disabled = loading;
        }

        // Send message to API
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message || isLoading) return;
            
            // Add user message to chat
            addMessage(message, 'user');
            input.value = '';
            
            // Show loading state
            setLoading(true);
            
            try {
                // Send to API
                const response = await fetch(`${API_BASE_URL}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        userId: userId,
                        message: message
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Error al enviar el mensaje');
                }
                
                if (data.success) {
                    // Add assistant response
                    const responseText = data.message.replace(/---FIN---/g, '').trim();
                    addMessage(responseText, 'assistant');
                    
                    // Provide haptic feedback (Telegram feature)
                    if (tg.HapticFeedback) {
                        tg.HapticFeedback.notificationOccurred('success');
                    }
                } else {
                    throw new Error(data.error || 'Error desconocido');
                }
                
            } catch (error) {
                console.error('Error sending message:', error);
                showError('Error al enviar el mensaje. Por favor intenta de nuevo.');
                
                // Provide error haptic feedback
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('error');
                }
            } finally {
                setLoading(false);
            }
        }

        // Send quick message
        function sendQuickMessage(message) {
            document.getElementById('messageInput').value = message;
            sendMessage();
        }

        // Handle Enter key
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isLoading) {
                sendMessage();
            }
        });

        // Handle Telegram back button
        tg.BackButton.onClick(() => {
            tg.close();
        });

        // Handle Telegram main button (optional)
        tg.MainButton.setText('Nueva Consulta');
        tg.MainButton.onClick(async () => {
            if (confirm('¿Deseas iniciar una nueva conversación?')) {
                try {
                    await fetch(`${API_BASE_URL}/session/${userId}`, {
                        method: 'DELETE'
                    });
                    
                    // Clear chat
                    document.getElementById('chatContainer').innerHTML = '';
                    chatHistory = [];
                    
                    // Reinitialize
                    init();
                    
                    if (tg.HapticFeedback) {
                        tg.HapticFeedback.notificationOccurred('success');
                    }
                } catch (error) {
                    console.error('Error clearing session:', error);
                    showError('Error al limpiar la sesión');
                }
            }
        });
        
        // Show main button only when there are messages
        function updateMainButton() {
            if (chatHistory.length > 2) {
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        }

        // Initialize on load
        window.addEventListener('load', () => {
            init();
            
            // Send initial viewport height to Telegram
            if (tg.setHeaderColor) {
                tg.setHeaderColor('secondary_bg_color');
            }
        });

        // Handle viewport changes (keyboard open/close)
        window.addEventListener('resize', () => {
            const chatContainer = document.getElementById('chatContainer');
            chatContainer.scrollTop = chatContainer.scrollHeight;
        });
    </script>
</body>
</html>
