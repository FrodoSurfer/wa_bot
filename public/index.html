<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurador del Bot de WhatsApp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #444;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="url"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="url"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            background: #f5f5f5;
            border: 2px dashed #ccc;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .file-input-label:hover {
            background: #efefef;
            border-color: #667eea;
        }

        .file-input-label.has-file {
            background: #e8f5e9;
            border-color: #4caf50;
        }

        input[type="file"] {
            position: absolute;
            left: -9999px;
        }

        .file-icon {
            font-size: 24px;
            margin-right: 10px;
        }

        .preview-container {
            margin-top: 15px;
            display: none;
        }

        .preview-container.active {
            display: block;
        }

        .preview-image {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            animation: slideIn 0.5s;
        }

        .result.active {
            display: block;
        }

        .result.success {
            background: #e8f5e9;
            border: 2px solid #4caf50;
        }

        .result.error {
            background: #ffebee;
            border: 2px solid #f44336;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-title {
            font-weight: 700;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .result.success .result-title {
            color: #2e7d32;
        }

        .result.error .result-title {
            color: #c62828;
        }

        .result-message {
            color: #555;
            line-height: 1.6;
        }

        .code-block {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 5px;
            font-size: 14px;
            color: #1565c0;
        }

        .required {
            color: #f44336;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Configurador del Bot de WhatsApp</h1>
        <p class="subtitle">Configura tu bot automáticamente con IA</p>

        <div class="info-box">
            ℹ️ Este configurador utiliza Gemini AI para analizar tu menú de servicios y generar automáticamente los archivos de configuración necesarios.
        </div>

        <form id="configForm">
            <div class="form-group">
                <label for="businessName">
                    Nombre del Negocio <span class="required">*</span>
                </label>
                <input 
                    type="text" 
                    id="businessName" 
                    name="businessName" 
                    placeholder="Ej: Studio 118, Salón de Belleza María"
                    required
                >
            </div>

            <div class="form-group">
                <label for="ownerName">
                    Nombre del/la Dueño/a
                </label>
                <input 
                    type="text" 
                    id="ownerName" 
                    name="ownerName" 
                    placeholder="Ej: Esveidy, María García"
                >
            </div>

            <div class="form-group">
                <label for="location">
                    Ubicación
                </label>
                <input 
                    type="text" 
                    id="location" 
                    name="location" 
                    placeholder="Ej: Querétaro, México"
                >
            </div>

            <div class="form-group">
                <label for="domain">
                    Dominio del Negocio <span class="required">*</span>
                </label>
                <input 
                    type="text" 
                    id="domain" 
                    name="domain" 
                    placeholder="Ej: salon de belleza, barbería, spa"
                    required
                >
            </div>

            <div class="form-group">
                <label for="menuImage">
                    Imagen del Menú/Servicios <span class="required">*</span>
                </label>
                <div class="file-input-wrapper">
                    <label for="menuImage" class="file-input-label" id="fileLabel">
                        <span class="file-icon">📸</span>
                        <span id="fileName">Seleccionar imagen del menú</span>
                    </label>
                    <input 
                        type="file" 
                        id="menuImage" 
                        name="menuImage" 
                        accept="image/*"
                        required
                    >
                </div>
                <div class="preview-container" id="previewContainer">
                    <img id="previewImage" class="preview-image" alt="Preview">
                </div>
            </div>

            <button type="submit" id="submitBtn">
                ✨ Generar Configuración
            </button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analizando imagen y generando configuración...</p>
        </div>

        <div class="result" id="result">
            <div class="result-title" id="resultTitle"></div>
            <div class="result-message" id="resultMessage"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('configForm');
        const fileInput = document.getElementById('menuImage');
        const fileLabel = document.getElementById('fileLabel');
        const fileName = document.getElementById('fileName');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        const resultTitle = document.getElementById('resultTitle');
        const resultMessage = document.getElementById('resultMessage');
        const submitBtn = document.getElementById('submitBtn');

        // Preview de la imagen
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                fileName.textContent = file.name;
                fileLabel.classList.add('has-file');
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImage.src = e.target.result;
                    previewContainer.classList.add('active');
                };
                reader.readAsDataURL(file);
            } else {
                fileName.textContent = 'Seleccionar imagen del menú';
                fileLabel.classList.remove('has-file');
                previewContainer.classList.remove('active');
            }
        });

        // Envío del formulario
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Ocultar resultado anterior
            result.classList.remove('active', 'success', 'error');
            
            // Mostrar loading
            loading.classList.add('active');
            submitBtn.disabled = true;

            const formData = new FormData(form);

            try {
                const response = await fetch('/generate-config', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                loading.classList.remove('active');

                if (response.ok && data.success) {
                    result.classList.add('active', 'success');
                    resultTitle.textContent = '✅ Configuración Generada Exitosamente';
                    
                    // Crear elemento de código de forma segura
                    const codeBlock = document.createElement('div');
                    codeBlock.className = 'code-block';
                    const codeTitle = document.createElement('strong');
                    codeTitle.textContent = 'Precios detectados:';
                    const codeContent = document.createElement('pre');
                    codeContent.textContent = JSON.stringify(data.precios, null, 2);
                    codeContent.style.margin = '5px 0 0 0';
                    codeContent.style.whiteSpace = 'pre-wrap';
                    codeBlock.appendChild(codeTitle);
                    codeBlock.appendChild(document.createElement('br'));
                    codeBlock.appendChild(codeContent);
                    
                    resultMessage.innerHTML = `
                        <p>${data.message}</p>
                        <p style="margin-top: 10px;">
                            <strong>Archivos generados:</strong>
                            <ul style="margin-left: 20px; margin-top: 5px;">
                                <li>config.json - Configuración del negocio</li>
                                <li>precios.json - Lista de precios y servicios</li>
                            </ul>
                        </p>
                        <p style="margin-top: 15px; padding: 10px; background: #fff3cd; border-radius: 5px; border-left: 4px solid #ffc107;">
                            <strong>⚡ Siguiente paso:</strong> Reinicia tu bot de WhatsApp para que cargue la nueva configuración.
                        </p>
                    `;
                    resultMessage.appendChild(codeBlock);
                } else {
                    throw new Error(data.error || 'Error desconocido');
                }
            } catch (error) {
                loading.classList.remove('active');
                result.classList.add('active', 'error');
                resultTitle.textContent = '❌ Error al Generar Configuración';
                resultMessage.textContent = error.message || 'Ocurrió un error al procesar tu solicitud. Por favor, intenta de nuevo.';
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
